name: Datapack core tests

on: [push, pull_request]

permissions:
  contents: read

env:
  TEST_FABRIC_SERVER: https://meta.fabricmc.net/v2/versions/loader/26.1.2/0.19.5/1.1.2/server/jar
  TEST_FABRIC_API: https://cdn.modrinth.com/data/P7dR8mSH/versions/uLkEd5dr/fabric-api-0.155.2%2B26.1.2.jar
  TEST_PACKTEST: https://cdn.modrinth.com/data/XsKUhp45/versions/MGLOzSvz/packtest-2.5.0.jar
  TEST_BOOKSHELF: https://cdn.modrinth.com/data/VCwEWhIk/versions/J3O5mUQ0/bookshelf-suite-26.1-v4.0.1.zip

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate integration boundaries and prepare core
        run: |
          python3 .github/scripts/prepare_core.py . .packtest-server
      - name: Download test dependencies
        working-directory: .packtest-server
        run: |
          mkdir -p mods
          curl -fL --retry 3 -o server.jar "$TEST_FABRIC_SERVER"
          curl -fL --retry 3 -o mods/fabric-api.jar "$TEST_FABRIC_API"
          curl -fL --retry 3 -o mods/packtest.jar "$TEST_PACKTEST"
          curl -fL --retry 3 -o world/datapacks/bookshelf-suite.zip "$TEST_BOOKSHELF"
          unzip -tq mods/fabric-api.jar
          unzip -tq mods/packtest.jar
          unzip -tq world/datapacks/bookshelf-suite.zip
      - name: Run core tests
        working-directory: .packtest-server
        run: |
          set -o pipefail
          java -Xmx2G -Dpacktest.auto -Dpacktest.auto.annotations -jar server.jar nogui 2>&1 | tee console.log
      - name: Keep server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packtest-core-logs
          path: |
            .packtest-server/console.log
            .packtest-server/logs/
            .packtest-server/crash-reports/
          if-no-files-found: ignore
